<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Prevent browser console and system overlay from complaining about benign dev HMR websocket closures and Google Maps auth failures
      (function() {
        // Global handler for Google Maps auth or activation failure
        window.grezto_maps_auth_failed = false;
        window.gm_authFailure = function() {
          console.warn("Grezto: Google Maps Platform activation/auth error detected. Triggering graceful UI fallback.");
          window.grezto_maps_auth_failed = true;
          window.dispatchEvent(new Event('grezto-maps-auth-failed'));
        };

        const originalConsoleError = console.error;
        console.error = function() {
          const args = Array.prototype.slice.call(arguments);
          const fullMessage = args.map(arg => {
            try { return typeof arg === 'object' ? JSON.stringify(arg) : String(arg); } catch(e) { return String(arg); }
          }).join(' ');

          const isMapsError = [
            'apinotactivatedmaperror',
            'api-not-activated-map-error',
            'invalidkeymaperror',
            'google maps javascript api error'
          ].some(keyword => fullMessage.toLowerCase().includes(keyword));

          if (isMapsError) {
            window.grezto_maps_auth_failed = true;
            window.dispatchEvent(new Event('grezto-maps-auth-failed'));
          }

          originalConsoleError.apply(console, arguments);
        };

        const originalConsoleWarn = console.warn;
        console.warn = function() {
          const args = Array.prototype.slice.call(arguments);
          const fullMessage = args.map(arg => {
            try { return typeof arg === 'object' ? JSON.stringify(arg) : String(arg); } catch(e) { return String(arg); }
          }).join(' ');

          const isMapsError = [
            'apinotactivatedmaperror',
            'api-not-activated-map-error',
            'invalidkeymaperror',
            'google maps javascript api error'
          ].some(keyword => fullMessage.toLowerCase().includes(keyword));

          if (isMapsError) {
            window.grezto_maps_auth_failed = true;
            window.dispatchEvent(new Event('grezto-maps-auth-failed'));
          }

          originalConsoleWarn.apply(console, arguments);
        };

        const suppressKeywords = [
          'websocket',
          'ws://',
          'wss://',
          'closed without opened',
          'hmr',
          'vite-hmr',
          'failed to connect',
          'script error.',
          'apinotactivatedmaperror',
          'google.maps',
          'googleapis.com',
          'gmp_mcp',
          'google maps javascript api'
        ];
        
        function shouldSuppress(msg, reason) {
          const strMessage = String(msg || '').toLowerCase();
          const strReason = reason ? String(reason.message || reason.stack || reason || '').toLowerCase() : '';
          return suppressKeywords.some(keyword => 
            strMessage.includes(keyword) || strReason.includes(keyword)
          );
        }

        // 1. Intercept global error bubbles in the capture phase
        window.addEventListener('error', function(e) {
          const message = e.message || '';
          if (shouldSuppress(message, e.error)) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
          }
        }, true);

        // 2. Intercept global unhandled promise rejections in the capture phase
        window.addEventListener('unhandledrejection', function(e) {
          const reason = e.reason;
          const message = reason ? (reason.message || reason) : '';
          if (shouldSuppress(message, reason)) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
          }
        }, true);

        // 3. Perfect WebSocket proxy to mock HMR connections and prevent any browser console error output
        const NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          class MockWebSocket {
            constructor(url, protocols) {
              this.url = url;
              this.protocols = protocols;
              this.readyState = 0; // CONNECTING
              this.listeners = {};
              this._onopen = null;
              this._onclose = null;
              this._onerror = null;
              this._onmessage = null;

              setTimeout(() => {
                this.readyState = 1; // OPEN
                const openEvent = {
                  type: 'open',
                  target: this,
                  currentTarget: this,
                };
                if (typeof this.onopen === 'function') {
                  try { this.onopen(openEvent); } catch (e) {}
                }
                this.dispatchEvent('open', openEvent);
              }, 50);
            }

            get onopen() { return this._onopen; }
            set onopen(val) { this._onopen = val; }
            get onclose() { return this._onclose; }
            set onclose(val) { this._onclose = val; }
            get onerror() { return this._onerror; }
            set onerror(val) { this._onerror = val; }
            get onmessage() { return this._onmessage; }
            set onmessage(val) { this._onmessage = val; }

            addEventListener(type, callback) {
              if (!this.listeners[type]) {
                this.listeners[type] = [];
              }
              this.listeners[type].push(callback);
            }

            removeEventListener(type, callback) {
              if (this.listeners[type]) {
                this.listeners[type] = this.listeners[type].filter(cb => cb !== callback);
              }
            }

            dispatchEvent(type, eventData = {}) {
              const list = this.listeners[type];
              if (list) {
                list.forEach(callback => {
                  try {
                    callback.call(this, eventData);
                  } catch (e) {}
                });
              }
            }

            send(data) {
              // Graceful no-op for mock
            }

            close() {
              this.readyState = 3; // CLOSED
              const closeEvent = {
                type: 'close',
                target: this,
                currentTarget: this,
                wasClean: true,
                code: 1000,
                reason: 'Bypassed websocket closed'
              };
              if (typeof this.onclose === 'function') {
                try { this.onclose(closeEvent); } catch (e) {}
              }
              this.dispatchEvent('close', closeEvent);
            }
          }

          // Assign prototype and static constants directly to mirror native behavior
          [MockWebSocket, MockWebSocket.prototype].forEach(obj => {
            Object.defineProperty(obj, 'CONNECTING', { value: 0 });
            Object.defineProperty(obj, 'OPEN', { value: 1 });
            Object.defineProperty(obj, 'CLOSING', { value: 2 });
            Object.defineProperty(obj, 'CLOSED', { value: 3 });
          });

          // Intercept instantiations
          const WebSocketProxy = new Proxy(NativeWebSocket, {
            construct(target, args) {
              const url = args[0];
              const isViteHmr = typeof url === 'string' && (
                url.includes('/ws') || 
                url.includes('vite') || 
                url.includes('hmr') || 
                url.includes('localhost') || 
                url.includes('127.0.0.1') || 
                url.includes('0.0.0.0') || 
                url.includes('10.0.2.2') || 
                url.includes('192.168.') || 
                url.includes('10.') || 
                url.includes('172.') || 
                url.includes('asia-southeast1.run.app')
              );
              
              if (isViteHmr) {
                return new MockWebSocket(args[0], args[1]);
              }
              // Fallback to real WebSocket for non-dev-HMR connections
              return Reflect.construct(target, args);
            }
          });

          window.WebSocket = WebSocketProxy;
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#043315" />
    <style>
      /* Extreme hardware acceleration and matching canvas background to prevent white flashes */
      html, body, #root {
        background-color: #fffdfa !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent !important;
      }
    </style>
    <title>Grezto - Express Delivery</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Grezto" />
    <link rel="apple-touch-icon" href="/grezto_organics_logo_1779291155265.png" />
    <link rel="icon" type="image/png" href="/grezto_organics_logo_1779291155265.png" />
  </head>
  <body>
    <div id="root">
      <!-- High-Performance Pre-React Instant Splash Screen (Zero-Flicker Native Launch Shield) -->
      <div id="pre-react-splash" style="position: fixed; inset: 0; background-color: #fffdfa; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; padding-left: 1.5rem; padding-right: 1.5rem; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; box-sizing: border-box;">
        
        <!-- Logo Wrapper (Exact visual clone of Splash.tsx for seamless mounting transition) -->
        <div style="width: 8rem; height: 8rem; background-color: #fffdfa; border-radius: 2.5rem; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(69, 10, 10, 0.2); border: 2px solid rgba(127, 29, 29, 0.1); box-sizing: border-box; animation: splashPulse 1.8s ease-in-out infinite;">
          <img src="/grezto_organics_logo_1779291155265.png" alt="Grezto Logo" style="width: 100%; height: 100%; object-fit: cover; display: block;" />
        </div>

        <!-- App Name -->
        <h1 style="margin-top: 2rem; margin-bottom: 0; font-size: 2.25rem; font-weight: 800; color: #7f1d1d; letter-spacing: -0.05em; text-align: center; line-height: 1; font-family: inherit;">
          Grezto
        </h1>

        <!-- Tagline -->
        <p style="margin-top: 0.75rem; margin-bottom: 0; color: rgba(127, 29, 29, 0.4); font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.3em; text-align: center; line-height: 1.5; font-family: inherit;">
          ASSAM FRESH HUB
        </p>

        <!-- Bouncing Loading Dots (CSS Keyframe Driven) -->
        <div style="position: absolute; bottom: 4rem; display: flex; gap: 0.75rem; align-items: center; justify-content: center;">
          <div class="pre-dot" style="width: 0.375rem; height: 0.375rem; background-color: #991b1b; border-radius: 50%; opacity: 0.2; animation: preDotBounce 1.5s infinite; animation-delay: 0s;"></div>
          <div class="pre-dot" style="width: 0.375rem; height: 0.375rem; background-color: #991b1b; border-radius: 50%; opacity: 0.2; animation: preDotBounce 1.5s infinite; animation-delay: 0.2s;"></div>
          <div class="pre-dot" style="width: 0.375rem; height: 0.375rem; background-color: #991b1b; border-radius: 50%; opacity: 0.2; animation: preDotBounce 1.5s infinite; animation-delay: 0.4s;"></div>
        </div>

      </div>

      <style>
        @keyframes splashPulse {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.025); }
        }
        @keyframes preDotBounce {
          0%, 100% { transform: scale(1); opacity: 0.2; }
          50% { transform: scale(1.5); opacity: 1; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
